apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-deployment
  labels:
    role: telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      role: telemetry
  template:
    metadata:
      labels:
        role: telemetry
    spec:
      containers:
      - name: nginx-telemetry
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-service
  labels:
    role: telemetry
spec:
  type: NodePort
  selector:
    role: telemetry
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30095
